name: Feedback
description: Report a bug, accessibility barrier, learning-content issue or feature idea
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Notation Lab. Do not include passwords, private scores, email addresses, MIDI serial numbers or other personal information.
  - type: dropdown
    id: category
    attributes:
      label: Feedback category
      options:
        - Bug or unexpected behaviour
        - Accessibility barrier
        - Learning content or notation
        - Feature request
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area affected
      options:
        - Note Trainer
        - Sight-Reading
        - Rhythm Lab
        - Composer
        - Ear Training
        - 8-Week Course
        - MIDI or keyboard input
        - Ads or consent
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: State what you did, what you expected and what actually happened.
      placeholder: I selected… I expected… Instead…
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the shortest repeatable sequence, if there is one.
      placeholder: 1. Open…\n2. Select…\n3. Play or press…
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: Include browser/version and device model when relevant. Do not include identifiers.
      placeholder: Brave 1xx on macOS; Korg nanoKEY2
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included passwords, private scores, email addresses, MIDI serial numbers or other personal information.
          required: true
